# hobby-server configuration.
# Copy to ~/.config/hobby-server/config.yaml and edit.

# ============================================================
# Server
# ============================================================
server:
  port: 5002
  env: "production"   # "production" sets Secure cookies; "development" doesn't

# ============================================================
# Email (optional)
# ============================================================
# Server-wide SMTP sender used by the shared auth system ("admin"
# project) to send each website's templated emails — invite, welcome —
# from the /admin/ console. Templates are static files in the website
# itself (feathers html/<site>/_email/), fetched over HTTP at send time.
# Omit the whole block to disable sending (the console says so).
# Gmail: use an App Password (Google account → Security → App passwords).
#
# email:
#   smtp_host: "smtp.gmail.com"
#   smtp_port: 587
#   username: "you@gmail.com"
#   password: "REPLACE_ME"          # app password, never logged
#   from: "Andrew Cheong <you@gmail.com>"
#   # site_base_url: "http://127.0.0.1:8765"   # dev only; prod derives from the request

# ============================================================
# Bots (optional)
# ============================================================
# Fake users that use the PUBLIC site API like real players (chat,
# presence…) — end-to-end testers that keep the site alive. Programs
# are switched on and off in the console (shared_bot_program). The
# password is provisioned onto every is_bot account that has none;
# it is never logged. See internal/bots and README "Bots".
#
# bots:
#   enabled: true
#   base_url: "https://andrewcheong.com"   # dev: "http://127.0.0.1:5002" with direct: true
#   direct: false
#   password: "REPLACE_ME"
#   tick: "5m"

# ============================================================
# Projects
# ============================================================
# Each project gets its own database, URL prefix, and cookie scope.
# The schema for each project lives at liquibase/<name>/changelog/
# (run by install.sh's Liquibase pass).
#
# For each project, create the database first:
#   CREATE DATABASE <name>_db;
#   CREATE USER <name>_user WITH PASSWORD '...';
#   GRANT ALL PRIVILEGES ON DATABASE <name>_db TO <name>_user;
#   \c <name>_db
#   GRANT ALL ON SCHEMA public TO <name>_user;
#
# Then add the project below and re-run install.sh.

projects:
  - name: rv
    database:
      host: "127.0.0.1"        # Cloud SQL Auth Proxy
      port: 5432
      name: "rv_trip"
      user: "rv_user"
      password: "REPLACE_ME"
    # Public path is andrewcheong.com/rv/api/* ; Apache proxies that to
    # 127.0.0.1:5002/api/rv/* . The server sees the post-Apache path,
    # so url_prefix should match what the server is asked.
    url_prefix: "/api/rv"
    cookie_path: "/rv/"

  - name: hxh
    database:
      host: "127.0.0.1"        # Cloud SQL Auth Proxy
      port: 5432
      name: "hxh"
      user: "hxh_user"
      password: "REPLACE_ME"
    # Public path is andrewcheong.com/hxh/api/* ; Apache proxies that to
    # 127.0.0.1:5002/api/hxh/* .
    url_prefix: "/api/hxh"
    cookie_path: "/hxh/"

  - name: bap
    database:
      host: "127.0.0.1"        # Cloud SQL Auth Proxy
      port: 5432
      name: "bap"
      user: "bap_user"
      password: "REPLACE_ME"
    # Public path is andrewcheong.com/bap/api/* ; Apache proxies that to
    # 127.0.0.1:5002/api/bap/* . Auth is the shared system (no
    # per-project login floor).
    url_prefix: "/api/bap"
    cookie_path: "/bap/"
    # Optional: Telegram message when a cup shatters. Omit to disable.
    # telegram:
    #   bot_token: "REPLACE_ME"
    #   chat_id: "REPLACE_ME"

  # SPECIAL: the "admin" project hosts the shared cross-website auth
  # system (internal/shared). Its database must be the shared
  # hobby_server DB (where the hobby_server_* tables live) and its
  # cookie_path must be "/" — the hobby_session SSO cookie spans the
  # whole domain.
  - name: admin
    database:
      host: "127.0.0.1"        # Cloud SQL Auth Proxy
      port: 5432
      name: "hobby_server"
      user: "hobby_server"
      password: "REPLACE_ME"
    # Public path is andrewcheong.com/admin/api/* ; Apache proxies that
    # to 127.0.0.1:5002/api/admin/* .
    url_prefix: "/api/admin"
    cookie_path: "/"

  # Add additional projects here:
  #
  # - name: next_thing
  #   database:
  #     host: "127.0.0.1"
  #     port: 5432
  #     name: "next_thing_db"
  #     user: "next_thing_user"
  #     password: "REPLACE_ME"
  #   url_prefix: "/api/next_thing"
  #   cookie_path: "/next_thing/"
